<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPC Nutrition Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: black brand bar, client rail on the left, one working panel on the right. Orange marks action and data only. */
  --ink:#0e0e0e; --paper:#ffffff; --wash:#f5f3f1; --line:#e3ded9; --muted:#6b645e;
  --accent:#f26a1b; --accent-ink:#b8470a; --accent-wash:#fdeee4;
  --good:#1e7a46; --warn:#9a5b00; --crit:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wash);color:var(--ink);font:400 15px/1.45 var(--body)}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h2{font-size:26px} h3{font-size:19px} h4{font-size:15px;letter-spacing:.05em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:4px solid var(--accent)}
.brand{display:flex;flex-direction:column}
.brand b{font:700 24px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c9c4bf}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0e0e0e}
.btn.primary:hover{background:#ff7d33}
.btn.ghost{background:transparent;border-color:#555;color:#fff}
.btn.ghost:hover{background:#222}
.btn.small{padding:4px 10px;font-size:13px}
.sync{align-self:center;font-size:13px;color:#c9c4bf}
.sync.err{color:#ffb4a8}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow input{flex:1 1 260px;min-width:0;border:1px solid #bdb6af;border-radius:6px;padding:8px 10px;background:var(--wash)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;padding:20px;max-width:1280px;margin:0 auto}
aside{display:flex;flex-direction:column;gap:10px}
.client{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid transparent;border-radius:6px;padding:10px 12px;cursor:pointer}
.client:hover{border-color:var(--muted)}
.client.on{border-left-color:var(--accent);border-color:var(--ink)}
.client strong{font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 8px;background:var(--wash);color:var(--muted);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:var(--good);background:#fff}
.pill.warn{color:var(--warn);border-color:var(--warn);background:#fff}
.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.sidenote{font-size:12px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tab{background:none;border:0;padding:8px 14px;font:600 16px var(--display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;color:var(--muted);border-radius:6px 6px 0 0}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid #bdb6af;border-radius:6px;padding:8px 10px;background:#fff;font-weight:400;color:var(--ink);width:100%}
label.f textarea{min-height:70px;resize:vertical}
label.f small{font-weight:400}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.note{border-left:4px solid var(--accent);background:var(--accent-wash);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:#fff6e5}
.note.crit{border-color:var(--crit);background:#fdecea}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px}
.tile .l{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font:600 26px/1.15 var(--body)}
.tile .s{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #bdb6af;background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.meal{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mhead,.irow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meal select,.meal input{border:1px solid #bdb6af;border-radius:6px;padding:6px 8px;background:#fff}
.mname{font-weight:600;width:170px}
.irow select{flex:1 1 200px;max-width:300px;min-width:0}
.gin input{width:78px}
.irow .hp{flex:1 1 120px}
.pill .btn{margin-left:4px;text-transform:none;letter-spacing:0}
.amt{font-weight:600}
.tot{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.off{color:var(--warn);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chart{border:1px solid var(--line);border-radius:8px;padding:10px 10px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:11px var(--body);fill:var(--muted)}
.chart text.end{fill:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:13px;margin:6px 0 10px}
.tip{position:fixed;z-index:9;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;pointer-events:none;white-space:nowrap}
.slider{display:flex;gap:10px;align-items:center}
.slider input{flex:1;padding:0;border:0}
.slider output{font-weight:600;color:var(--ink);min-width:2ch;text-align:right}
.weeknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* printable plan */
.sheet{background:#fff;border:1px solid var(--line);max-width:800px;margin:0 auto;width:100%}
.sheet .band{background:var(--ink);color:#fff;padding:18px 24px;border-bottom:5px solid var(--accent);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sheet .band b{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;display:block}
.sheet .band span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sheet .band .who{text-align:right;font-size:13px}
.sheet .body{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.sheet h3{border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px}
.sheet ul{margin:0;padding-left:18px}
.sheet .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.sheet .fine{font-size:11px;color:var(--muted)}
.sec{break-inside:avoid}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;padding:16px}
  aside{flex-direction:row;flex-wrap:wrap}
  .client{flex:1 1 200px}
}
@media print{
  @page{margin:10mm}
  body{background:#fff}
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{position:absolute;left:0;top:0;max-width:none;border:0}
  .sheet .mealcols{display:block}
  .sheet .mealcols .sec+.sec{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Kelly Performance Club</b><span>Nutrition Coach &middot; Built to Perform</span></div>
  <div class="acts"><span class="sync" id="sync"></span>
    <button class="btn ghost" data-act="settings" id="btn-settings">Google Sheet</button>
    <button class="btn ghost" data-act="backup" id="btn-backup">Download backup</button>
    <button class="btn ghost" data-act="restore" id="btn-restore">Restore backup</button>
  </div>
</header>
<div class="shell">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="tip" class="tip" hidden></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const KEY='kpc_nutrition_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmtD=s=>parseD(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtDY=s=>parseD(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const num=n=>Number(n).toLocaleString('en-US');
const r5=n=>Math.round(n/5)*5;
function nextFriday(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+((5-x.getDay()+7)%7));return x}
function lastFriday(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-5+7)%7));return x}
function shiftWeek(s,n){const d=parseD(s);d.setDate(d.getDate()+7*n);return iso(d)}
function ageOf(dob){if(!dob)return null;const b=parseD(dob),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a}
const isMinor=c=>{const a=ageOf(c.dob);return a!==null&&a<18};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ---------- reference data ---------- */
const HABITS=[
 ['h1','Foundations','Eat slowly: 15 to 20 minutes per meal'],
 ['h2','Foundations','Stop eating at 80% full'],
 ['h3','Foundations','Protein at every meal'],
 ['h4','Foundations','Vegetables or fruit at every meal'],
 ['h5','Foundations','Hit your daily water goal'],
 ['h6','Foundations','Hit your daily step goal'],
 ['h7','Foundations','Sleep 7 to 9 hours with a set bedtime'],
 ['h8','Meals','Eat 3 to 4 meals on a regular schedule'],
 ['h9','Meals','Eat breakfast within 2 hours of waking'],
 ['h10','Meals','Quality carbs at most meals'],
 ['h11','Meals','Healthy fats every day'],
 ['h12','Meals','Keep liquid calories to a minimum'],
 ['h13','Meals','No screens during meals'],
 ['h14','Performance','Carbs and protein 1 to 3 hours before training'],
 ['h15','Performance','Recovery meal within 2 hours after training'],
 ['h16','Performance','Follow your game-day fueling plan'],
 ['h17','Performance','Fluids and electrolytes during long sessions'],
 ['h18','Performance','Pack snacks for school, work or travel'],
 ['h19','Planning','Meal prep twice this week'],
 ['h20','Planning','Plan tomorrow\'s meals the night before'],
 ['h21','Planning','Grocery shop with a list'],
 ['h22','Planning','Check the menu and pick your order before eating out'],

 ['h24','Tracking','Weigh and measure one meal per day'],
 ['h25','Tracking','Submit your Friday check-in on time'],
 ['h26','Lifestyle','10-minute walk after one meal per day'],
 ['h27','Lifestyle','Limit alcohol to the number of drinks we agreed on','adult']
].map(([id,cat,text,only])=>({id,cat,text,only}));

/* macros per 100 g. The last two values are grams per piece and the piece name, for foods people count */
const BASE_FOODS=[
 ['chicken','P','chicken breast, cooked',31,0,3.6],['chickenthigh','P','chicken thigh, cooked',25,0,9],['turkeybreast','P','turkey breast, cooked',29,0,2],
 ['turkey','P','ground turkey 93%, cooked',27,0,10],['beef90','P','lean ground beef 90%, cooked',26,0,11],['sirloin','P','sirloin steak, cooked',27,0,9],
 ['pork','P','pork tenderloin, cooked',26,0,4],['salmon','P','salmon, cooked',23,0,12],['cod','P','white fish (cod, tilapia), cooked',23,0,1.5],
 ['tuna','P','tuna, canned in water',24,0,1],['shrimp','P','shrimp, cooked',24,0.2,0.3],['eggs','P','whole eggs',12.6,0.7,9.5,50,'egg'],
 ['eggwhites','P','egg whites',11,0.7,0.2],['yogurt','P','nonfat Greek yogurt',10,3.6,0.4],['cottage','P','low-fat cottage cheese',11,4.3,2.3],
 ['whey','P','whey protein powder',80,10,5,30,'scoop'],['tofu','P','firm tofu',15,3,8],['deli','P','deli turkey',17,3,2],['edamame','P','edamame, shelled',11.9,8.9,5.2],
 ['whiterice','C','white rice, cooked',2.7,28.2,0.3],['brownrice','C','brown rice, cooked',2.7,25.6,1],['oats','C','rolled oats, dry',13.2,67.7,6.5],
 ['creamrice','C','cream of rice, dry',6.3,82,0.5],['potato','C','potato, baked',2.5,21.2,0.1],['sweetpotato','C','sweet potato, baked',2,20.7,0.2],
 ['pasta','C','pasta, cooked',5.8,30.9,0.9],['quinoa','C','quinoa, cooked',4.4,21.3,1.9],['couscous','C','couscous, cooked',3.8,23.2,0.2],
 ['beans','C','black beans, cooked',8.9,23.7,0.5],['lentils','C','lentils, cooked',9,20.1,0.4],['chickpeas','C','chickpeas, cooked',8.9,27.4,2.6],
 ['bread','C','whole wheat bread',12.5,43,3.5,32,'slice'],['bagel','C','bagel',10,53,1.6,100,'bagel'],['engmuffin','C','English muffin',8,46,1.8,57,'muffin'],
 ['tortilla','C','flour tortilla (8 in)',8.3,49,7.5,49,'tortilla'],['corntortilla','C','corn tortilla',5.7,44.6,2.9,26,'tortilla'],
 ['cereal','C','toasted oat cereal',12,73,6.5],['pretzels','C','pretzels',10,80,3],['ricecakes','C','rice cakes',8,82,3,9,'rice cake'],
 ['banana','C','banana',1.1,22.8,0.3,118,'banana'],['apple','C','apple',0.3,13.8,0.2,182,'apple'],['orange','C','orange',0.9,11.8,0.1,130,'orange'],
 ['grapes','C','grapes',0.7,18.1,0.2],['berries','C','mixed berries',0.7,12,0.3],['pineapple','C','pineapple',0.5,13.1,0.1],['raisins','C','raisins',3.1,79,0.5],
 ['honey','C','honey',0.3,82.4,0],['chocmilk','C','low-fat chocolate milk',3.4,10.5,1],['sportsdrink','C','sports drink',0,6,0],
 ['oliveoil','F','olive oil',0,0,100],['avocado','F','avocado',2,8.5,14.7],['almonds','F','almonds',21,21.6,50],['walnuts','F','walnuts',15,13.7,65],
 ['cashews','F','cashews',18,30,44],['pb','F','peanut butter',22.5,22,51],['almondbutter','F','almond butter',21,19,55],['cheddar','F','cheddar cheese',22.9,3.1,33.3],
 ['mozzarella','F','part-skim mozzarella',24,3,16],['butter','F','butter',0.9,0.1,81],['chia','F','chia seeds',16.5,42,30.7],['hummus','F','hummus',7.9,14.3,9.6],
 ['mixedveg','V','mixed vegetables, cooked',2.6,11.9,0.2],['broccoli','V','broccoli, cooked',2.4,7.2,0.4],['spinach','V','spinach',2.9,3.6,0.4],
 ['salad','V','salad greens',1.4,2.9,0.2],['peppers','V','bell peppers',1,6,0.3],['greenbeans','V','green beans, cooked',1.9,7.9,0.3],
 ['carrots','V','carrots',0.9,9.6,0.2],['asparagus','V','asparagus, cooked',2.4,4.1,0.2],['tomato','V','tomato',0.9,3.9,0.2],['cucumber','V','cucumber',0.7,3.6,0.1],['zucchini','V','zucchini, cooked',1.1,2.7,0.4]
].map(([id,cat,name,p,c,f,each,unit])=>({id,cat,name,p:p/100,c:c/100,f:f/100,each,unit}));
let FOODS=BASE_FOODS,FOOD=Object.fromEntries(BASE_FOODS.map(f=>[f.id,f]));
function refreshFoods(s){FOODS=BASE_FOODS.concat(s.foods||[]);FOOD=Object.fromEntries(FOODS.map(f=>[f.id,f]))}
const CATS=[['P','Protein'],['C','Carbs'],['F','Fats'],['V','Vegetables']];
const MULTS=[[1.2,'Sedentary (1.2)'],[1.375,'Lightly active (1.375)'],[1.55,'Moderately active (1.55)'],[1.725,'Very active (1.725)'],[1.9,'Extremely active (1.9)']];
const TEMPLATE={Breakfast:['yogurt','oats','berries','pb'],Lunch:['chicken','whiterice','mixedveg','avocado'],Dinner:['beef90','potato','broccoli','oliveoil'],Snack:['whey','banana','almonds']};
const newItem=id=>FOOD[id].cat==='V'?{food:id,g:100,auto:false}:{food:id,g:0,auto:true};
function tmpl(name){return{name,size:/snack/i.test(name)?.5:1,items:(TEMPLATE[name]||TEMPLATE.Snack).map(newItem)}}
function namesFor(n){return{3:['Breakfast','Lunch','Dinner'],4:['Breakfast','Lunch','Snack','Dinner'],5:['Breakfast','Snack','Lunch','Snack','Dinner'],6:['Breakfast','Snack','Lunch','Snack','Dinner','Snack']}[n]}

/* ---------- calculations (pure) ---------- */
function calc(c){
  const lb=Number(c.weightLb)||0, inch=Number(c.heightIn)||0, age=ageOf(c.dob);
  const kg=lb*0.45359237, cm=inch*2.54, bf=c.bfPct===''||c.bfPct==null?null:Number(c.bfPct);
  if(!lb||(bf===null&&(!inch||age===null))) return null;
  let bmr,eq;
  if(bf!==null&&bf>0){bmr=370+21.6*kg*(1-bf/100);eq='Katch-McArdle'}
  else{bmr=10*kg+6.25*cm-5*age+(c.sex==='M'?5:-161);eq='Mifflin-St Jeor'}
  const maint=bmr*Number(c.mult);
  const goal=isMinor(c)&&c.goal==='lose'?'maintain':c.goal;
  const adj=goal==='lose'?1-Number(c.losePct)/100:goal==='gain'?1+Number(c.gainPct)/100:1;
  const P=r5(Number(c.proteinPerLb)*lb), F=r5(Number(c.fatPerLb)*lb);
  /* the multiplier sets the weekly average; the bump moves carbs from rest days to training days without changing that average */
  const n=c.trainDays.filter(Boolean).length, bump=n>0&&n<7?Math.max(0,Number(c.carbBump)||0):0;
  const avgC=(maint*adj-4*P-9*F)/4;
  const day=C=>{C=Math.max(0,r5(C));return{p:P,c:C,f:F,kcal:4*P+4*C+9*F}};
  const train=day(avgC+bump*(7-n)/7), rest=day(avgC-bump*n/7);
  return{bmr,eq,maint,goal,adj,train,rest,nTrain:n,weekAvg:(n*train.kcal+(7-n)*rest.kcal)/7};
}
const half=n=>Math.round(n*2)/2;
const portions=d=>({palms:half(d.p/25),cups:half(d.c/25),thumbs:half(d.f/10)});
function qty(q){const w=Math.floor(q),fr=q-w,m={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[fr];return m===undefined?String(q):(w?w:'')+m||'0'}
const HP={P:'palm',C:'cupped handful',F:'thumb',V:'fist'};
/* one hand portion = 25 g protein, 25 g carbs, 10 g fat, or about 85 g of vegetables */
function hpText(f,g){const per=f.cat==='V'?85:f.cat==='P'?25/f.p:f.cat==='C'?25/f.c:10/f.f;const q=Math.max(.5,Math.round(g/per*2)/2);return`${qty(q)} ${HP[f.cat]}${q>1?'s':''}`}
function itemLine(c,f,g){if(!(g>0))return null;if(c.method==='portions')return`${hpText(f,g)} ${f.name}`;
  let n='';if(f.each){const q=Math.max(.5,Math.round(g/f.each*2)/2);n=` (about ${qty(q)} ${f.unit}${q>1?'s':''})`}return`${g} g ${f.name}${n}`}
/* size the auto foods so the meal lands on its protein, carb and fat targets; foods you set by hand are left alone */
function solveMeal(t,items){
  const W={p:16,c:16,f:81},M=['p','c','f'],prim={P:'p',C:'c',F:'f'},fs=items.map(it=>FOOD[it.food]);
  const g=items.map((it,i)=>!fs[i]||it.auto?0:Math.max(0,Number(it.g)||0));
  const auto=items.map((it,i)=>fs[i]&&it.auto?i:-1).filter(i=>i>=0);
  if(!auto.length)return g;
  const rem={...t};g.forEach((x,i)=>{if(fs[i])M.forEach(m=>rem[m]-=x*fs[i][m])});
  const g0=g.slice();
  for(const cat of['P','C','F','V']){const idx=auto.filter(i=>fs[i].cat===cat),m=prim[cat];idx.forEach(i=>{g0[i]=m&&fs[i][m]>0?Math.max(0,rem[m])/idx.length/fs[i][m]:0})}
  auto.forEach(i=>g[i]=g0[i]);
  for(let n=0;n<80;n++)for(const j of auto){const a=fs[j];let nu=0,den=0;
    for(const m of M){let r=t[m];for(let q=0;q<g.length;q++)if(q!==j&&fs[q])r-=g[q]*fs[q][m];nu+=W[m]*a[m]*r;den+=W[m]*a[m]*a[m]}
    const lam=.03*den;g[j]=den?Math.max(0,(nu+lam*g0[j])/(den+lam)):0}
  auto.forEach(i=>g[i]=Math.round(g[i]/5)*5);
  return g}

    m.items.forEach((it,i)=>{const f=FOOD[it.food];if(f)M.forEach(x=>tot[x]+=g[i]*f[x])});tot.kcal=4*tot.p+4*tot.c+9*tot.f;return{m,target,g,tot}});
  const tot=meals.reduce((a,m)=>({p:a.p+m.tot.p,c:a.c+m.tot.c,f:a.f+m.tot.f,kcal:a.kcal+m.tot.kcal}),{p:0,c:0,f:0,kcal:0});
  return{meals,tot}}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
const tick=n=>n>=10000?(n/1000)+'K':num(Math.round(n*10)/10);
function chart(title,unit,pts,o={}){
  pts=pts.filter(p=>p.v!==''&&p.v!=null&&!isNaN(Number(p.v))).map(p=>({d:p.d,v:Number(p.v)}));
  if(!pts.length)return`<div class="chart"><h4>${title}</h4><p class="empty">No data yet</p></div>`;
  const W=320,H=170,L=38,R=50,T=12,B=24,pw=W-L-R,ph=H-T-B,vals=pts.map(p=>p.v).concat(o.goal?[o.goal]:[]);
  let lo,hi,ticks=[];
  if(o.fixed){[lo,hi]=o.fixed;ticks=o.ticks}
  else{lo=o.zero?0:Math.min(...vals);hi=Math.max(...vals);const st=niceStep(((hi-lo)||Math.max(1,hi*.05))/2);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;for(let v=lo;v<=hi+st/1e6;v+=st)ticks.push(v)}
  const X=i=>L+(pts.length===1?pw/2:pw*i/(pts.length-1)),Y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(''),last=pts[pts.length-1],li=pts.length-1,cw=pw/pts.length;
  return`<div class="chart"><h4>${title}</h4><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: latest ${tick(last.v)} ${unit} on ${fmtD(last.d)}">
  ${ticks.map(v=>`<line x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3ded9" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${tick(v)}</text>`).join('')}
  ${o.goal?`<line x1="${L}" x2="${L+pw}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="#6b645e" stroke-width="1"/><text x="${L+pw+6}" y="${Y(o.goal)+4}">Goal</text>`:''}
  ${pts.length>1?`<path d="${path}L${X(li)},${T+ph}L${X(0)},${T+ph}Z" fill="#f26a1b" opacity=".1"/><path d="${path}" fill="none" stroke="#f26a1b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
  <circle cx="${X(li)}" cy="${Y(last.v)}" r="5" fill="#f26a1b" stroke="#fff" stroke-width="2"/>
  ${o.goal&&Math.abs(Y(o.goal)-Y(last.v))<12?'':`<text class="end" x="${X(li)+9}" y="${Y(last.v)+4}">${tick(last.v)}</text>`}
  <text x="${L}" y="${H-6}">${fmtD(pts[0].d)}</text>${pts.length>1?`<text x="${L+pw}" y="${H-6}" text-anchor="end">${fmtD(last.d)}</text>`:''}
  ${pts.map((p,i)=>`<rect x="${X(i)-cw/2}" y="${T}" width="${cw}" height="${ph}" fill="transparent" data-tip="${fmtD(p.d)}: ${num(p.v)} ${unit}"/>`).join('')}</svg></div>`;
}

  if(!k)return`<div class="panel"><div class="note warn">Set up targets first.</div></div>`;
  const minor=isMinor(c),t=targetsTable(c,k),wk=c.focus[ui.week]||{habits:[],tasks:''};
  const habits=wk.habits.map(id=>(allHabits().find(h=>h.id===id)||{}).text).filter(Boolean),tasks=wk.tasks.split('\n').map(s=>s.trim()).filter(Boolean);
  const meals=which=>dayPlan(c,k,which).meals.map(x=>`<tr><th>${esc(x.m.name)}</th><td>${x.m.items.map((it,n)=>itemLine(c,FOOD[it.food],x.g[n])).filter(Boolean).map(esc).join('<br>')}</td></tr>`).join('');
  return`<div class="panel"><div class="head">${weekNav()}<button class="btn primary" data-act="print" id="btn-print">Print or save as PDF</button></div>
  <p class="sidenote">In the print window, choose "Save as PDF". The plan style (macros or hand portions) is set on the Targets tab.</p></div>
  <div class="sheet"><div class="band"><div><b>Kelly Performance Club</b><span>Built to Perform</span></div><div class="who"><b style="font-size:22px">${esc(c.name)}</b>${minor?'Fueling plan':'Nutrition plan'} &middot; Week ending ${fmtDY(ui.week)}<br>Coach Logan Kelly</div></div>
  <div class="body">
  <div class="sec"><h3>${c.method==='portions'?'Daily portions':'Daily targets'}</h3><table>${t.head}${c.method==='portions'?t.port:t.macro}</table>
  <p class="fine">Training days: ${DAYS.filter((d,i)=>c.trainDays[i]).join(', ')||'none set'}. ${c.method==='portions'?'A palm is a portion of protein the size of your palm. A cupped handful is a portion of carbs. A thumb is a portion of fats.':'Protein and fat stay the same every day. Training days get more carbs.'}</p></div>
  <div class="cols"><div class="sec"><h3>This week's focus</h3>${habits.length||tasks.length?`<ul>${habits.concat(tasks).map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:'<p class="fine">No focus set for this week.</p>'}</div>
  <div class="sec"><h3>Daily goals</h3><ul><li>Steps: ${num(c.stepGoal)}</li><li>Water: ${c.waterGoal} oz</li><li>Check-in due every Friday</li></ul></div></div>
  <div class="cols mealcols"><div class="sec"><h3>Training day meals</h3><table>${meals('train')}</table></div><div class="sec"><h3>Rest day meals</h3><table>${meals('rest')}</table></div></div>
  <p class="fine">Weigh foods cooked unless the name says dry. Swap foods within the same group (protein, carb, fat) as needed. These targets are coaching estimates and are not medical advice.</p>
  </div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='restoreFile'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!Array.isArray(s.clients))throw 0;refreshFoods(s);s.clients.forEach(normalize);state=s;if(!cur())state.selected=(state.clients[0]||{}).id;ui.msg='Backup restored.';save()}catch(x){ui.msg='That file is not a KPC Nutrition backup.'}el.value='';render()};rd.readAsText(f);return}
  const k=el.dataset.k;if(!k)return;const c=cur();
  if(el.type==='date'){setPath(c,k,el.value);save();ui.dateDirty=true;return}
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.t==='num')v=v===''?'':Number(v);
  if(['meals','mult'].includes(k)||k.endsWith('|size'))v=Number(v);
  setPath(c,k,v);
  if(k.endsWith('|g')){const it=getPath(c,k.slice(0,-2));it.auto=false;it.g=Math.max(0,Number(v)||0)}
  if(k.endsWith('|food')){const it=getPath(c,k.slice(0,-5));it.auto=FOOD[v].cat!=='V';if(!it.auto)it.g=100}
  if(k.startsWith('focus|')){const w=c.focus[ui.week];w.habits=w.habits||[]}
  normalize(c);save();setTimeout(render,0);
});
/* date boxes fire change on every keystroke, so they redraw only when you leave the box */
document.addEventListener('focusout',e=>{const el=e.target;if(ui.dateDirty&&el.isConnected&&el.type==='date'&&el.dataset.k){ui.dateDirty=false;normalize(cur());save();setTimeout(render,0)}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.d;if(!k||!ui.draft)return;ui.draft[k]=el.value;const o=document.getElementById('o-'+k);if(o)o.textContent=el.value});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id,c=cur();ui.msg='';const snap=()=>JSON.stringify(state,(k,v)=>k==='selected'||k==='isNew'||k==='intakeNew'?undefined:v),before=snap();
  if(act==='select'){ui.view='client';state.selected=id;ui.draft=null;ui.confirmDel=null}
  else if(act==='add'){ui.view='client';const n=blank();state.clients.push(normalize(n));state.selected=n.id;ui.tab='profile';ui.draft=null}
  else if(act==='rmex'){state.clients=state.clients.filter(x=>!x.example);state.selected=(state.clients[0]||{}).id;ui.draft=null}
  else if(act==='askdel')ui.confirmDel=c.id;
  else if(act==='nodel')ui.confirmDel=null;
  else if(act==='del'){state.clients=state.clients.filter(x=>x.id!==c.id);state.selected=(state.clients[0]||{}).id;ui.confirmDel=null;ui.draft=null}
  else if(act==='tab'){ui.tab=id}
  else if(act==='week'){ui.week=shiftWeek(ui.week,Number(id))}
  else if(act==='habit'){const w=c.focus[ui.week]=c.focus[ui.week]||{habits:[],tasks:''};w.habits=w.habits.includes(id)?w.habits.filter(x=>x!==id):w.habits.concat(id)}
  else if(act==='addhabit'){const t=$('#newHabit').value.trim();if(t){const h={id:'u'+Date.now(),cat:'Your habits',text:t};state.habits=(state.habits||[]).concat(h);const w=c.focus[ui.week]=c.focus[ui.week]||{habits:[],tasks:''};w.habits.push(h.id)}}
  else if(act==='savecheckin'){const d=ui.draft;if(!d.date){ui.msg='Pick a week-ending date.'}else{const n=x=>x===''?'':Number(x);
    c.checkins=c.checkins.filter(x=>x.date!==d.date).concat({date:d.date,weight:c.trackWeight?n(d.weight):'',adherence:Number(d.adherence),deviations:d.deviations,steps:n(d.steps),water:n(d.water),sleep:Number(d.sleep),energy:Number(d.energy),strength:Number(d.strength),notes:d.notes,clientNotes:(c.checkins.find(x=>x.date===d.date)||{}).clientNotes||'',ts:Date.now()});ui.draft=null;ui.msg='Check-in saved.'}}
  else if(act==='delcheckin'){const gone=c.checkins.find(x=>x.date===id);if(gone&&gone.key)state.dismissed=(state.dismissed||[]).concat(gone.key);c.checkins=c.checkins.filter(x=>x.date!==id)}
  else if(act==='addfood'){const [w,i]=id.split('|');c.plan[w][i].items.push(newItem('chicken'))}
  else if(act==='rmfood'){const [w,i,j]=id.split('|');c.plan[w][i].items.splice(Number(j),1)}
  else if(act==='autofood'){const [w,i,j]=id.split('|'),it=c.plan[w][i].items[j];if(it.auto){it.g=dayPlan(c,calc(c),w).meals[i].g[j];it.auto=false}else it.auto=true}
  else if(act==='copyday'){c.plan.rest=JSON.parse(JSON.stringify(c.plan.train));ui.msg='Training day copied to rest day.'}
  else if(act==='addfoodlib'){const name=$('#nf-name').value.trim(),v=x=>Math.max(0,Number($('#nf-'+x).value)||0)/100;
    if(!name||v('p')+v('c')+v('f')<=0||v('p')+v('c')+v('f')>1)ui.msg='Enter a food name and macros per 100 g that add up to 100 g or less.';
    else{state.foods=(state.foods||[]).concat({id:'x'+Date.now(),cat:$('#nf-cat').value,name,p:v('p'),c:v('c'),f:v('f')});refreshFoods(state);ui.msg=name+' added to the food menus.'}}
  else if(act==='rmfoodlib'){state.foods=(state.foods||[]).filter(f=>f.id!==id);refreshFoods(state);state.clients.forEach(normalize)}
  else if(act==='settings'){ui.view='settings'}
  else if(act==='connect'){connect();return}
  else if(act==='syncnow'){syncNow();return}
  else if(act==='useremote'||act==='uselocal'){resolve(act==='useremote');return}
  else if(act==='disconnect'){conn={url:conn.url,site:conn.site};saveConn();setSync('off');ui.msg='Disconnected. Data stays in this browser and in the Sheet.'}
  else if(act==='copylink'){const el=document.getElementById(id);el.select();try{navigator.clipboard.writeText(el.value).then(()=>{ui.msg='Link copied.';render()},()=>{})}catch(x){}return}
  else if(act==='print'){window.print();return}
  else if(act==='backup'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));a.download=`kpc-nutrition-backup-${iso(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();ui.msg='Backup downloaded.'}
  else if(act==='restore'){$('#restoreFile').click();return}
  if(ui.view==='client'&&ui.tab==='checkins'&&cur())cur().checkins.forEach(x=>{delete x.isNew});
  if(ui.view==='client'&&ui.tab==='profile'&&cur()&&act!=='syncnow')delete cur().intakeNew;
  if(snap()!==before)save();else saveLocal();
  render();
});
const tipEl=$('#tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.hidden=true;return}tipEl.textContent=t.dataset.tip;tipEl.hidden=false;const x=Math.min(e.clientX+12,window.innerWidth-tipEl.offsetWidth-8);tipEl.style.left=x+'px';tipEl.style.top=(e.clientY-30)+'px'}
document.addEventListener('mousemove',showTip);document.addEventListener('click',showTip);
state.clients.forEach(normalize);
render();
setSync(conn.linked?'busy':'off');
if(conn.linked)syncNow();
</script>
</body>
